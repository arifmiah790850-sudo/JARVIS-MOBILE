name: Build BlueDot APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'BlueDot/**'
      - '.github/workflows/bluedot-build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Build APK
        working-directory: BlueDot
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BlueDot-Always-Overlay-APK
          path: BlueDot/app/build/outputs/apk/debug/app-debug.apk
