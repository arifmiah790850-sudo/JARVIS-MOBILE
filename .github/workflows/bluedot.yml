name: Build BlueDot APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Build BlueDot
        working-directory: bluedot
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload BlueDot APK
        uses: actions/upload-artifact@v4
        with:
          name: BlueDot-APK
          path: bluedot/app/build/outputs/apk/debug/app-debug.apk
