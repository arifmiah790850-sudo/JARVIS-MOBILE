
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JARVIS AI</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #050b16;
    color: #00eaff;
    font-family: Arial, sans-serif;
    text-align: center;
}

header {
    padding: 25px;
    font-size: 30px;
    font-weight: bold;
    letter-spacing: 5px;
}

.status {
    color: #00ff88;
    margin: 15px;
    font-size: 14px;
}

.circle {
    width: 170px;
    height: 170px;
    border: 3px solid #00eaff;
    border-radius: 50%;
    margin: 35px auto;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 65px;
    box-shadow: 0 0 30px #007bff;
}

.active {
    animation: pulse 1.5s infinite;
}

@keyframes pulse {
    50% {
        box-shadow: 0 0 60px #00eaff;
    }
}

button {
    background: #007bff;
    color: white;
    border: none;
    padding: 14px 22px;
    margin: 7px;
    border-radius: 10px;
    font-size: 15px;
}

.stop {
    background: #d62828;
}

input, select {
    width: 85%;
    padding: 14px;
    margin: 8px;
    border-radius: 8px;
    border: 1px solid #00eaff;
    background: #101c30;
    color: white;
}

#chat {
    margin: 20px;
    padding: 12px;
    height: 220px;
    overflow-y: auto;
    text-align: left;
    border: 1px solid #006b88;
    border-radius: 10px;
}

.message {
    padding: 10px;
    margin: 8px 0;
    background: #10243a;
    border-radius: 8px;
    overflow-wrap: anywhere;
}


#customPanel {
    display: none;
    margin: 15px;
    padding: 15px;
    border: 1px solid #00eaff;
    border-radius: 12px;
    background: #101c30;
}
.logoChoice {
    font-size: 28px;
    min-width: 58px;
    padding: 12px;
}


/* JARVIS CYBERPUNK ANIMATION */
body {
    isolation: isolate;
    overflow-x: hidden;
}

.fx-background {
    position: fixed;
    inset: 0;
    z-index: 0;
    overflow: hidden;
    pointer-events: none;
    background:
        radial-gradient(ellipse at 50% 45%, #092b59 0%, transparent 55%),
        radial-gradient(ellipse at 10% 85%, #250b55 0%, transparent 45%),
        #030712;
}

body > :not(.fx-background) {
    position: relative;
    z-index: 1;
}

.fx-background::before {
    content: "";
    position: absolute;
    inset: -50%;
    background-image:
        radial-gradient(circle, #00eaff 1px, transparent 2px),
        radial-gradient(circle, #a855f7 1px, transparent 2px);
    background-size: 75px 75px, 113px 113px;
    background-position: 0 0, 35px 45px;
    opacity: .55;
    animation: particleDrift 24s linear infinite;
}

.fx-background::after {
    content: "";
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(
        0deg,
        transparent 0px,
        transparent 4px,
        rgba(0, 234, 255, .025) 5px
    );
    animation: scanMove 7s linear infinite;
}

.fx-orbit {
    position: absolute;
    width: 75vw;
    height: 75vw;
    max-width: 520px;
    max-height: 520px;
    border: 1px solid rgba(0, 234, 255, .35);
    border-radius: 50%;
    left: 50%;
    top: 48%;
    box-shadow: 0 0 22px #007bff, inset 0 0 25px #005bff;
}

.fx-orbit.one {
    transform: translate(-50%, -50%) rotateX(65deg);
    animation: orbitSpin 16s linear infinite;
}

.fx-orbit.two {
    width: 62vw;
    height: 62vw;
    border-color: rgba(168, 85, 247, .65);
    box-shadow: 0 0 24px #8b5cf6, inset 0 0 20px #6d28d9;
    transform: translate(-50%, -50%) rotateX(65deg);
    animation: orbitReverse 12s linear infinite;
}

.fx-orbit.three {
    width: 90vw;
    height: 90vw;
    border-style: dashed;
    opacity: .35;
    transform: translate(-50%, -50%) rotateY(65deg);
    animation: orbitSpin 30s linear infinite;
}

.fx-beam {
    position: absolute;
    width: 2px;
    height: 45vh;
    left: 50%;
    top: 20%;
    background: linear-gradient(transparent, #00eaff, #a855f7, transparent);
    filter: blur(2px);
    opacity: .55;
    animation: beamPulse 3s ease-in-out infinite;
}

@keyframes particleDrift {
    from { transform: translateY(0); }
    to { transform: translateY(-180px); }
}

@keyframes scanMove {
    from { transform: translateY(-20px); }
    to { transform: translateY(20px); }
}

@keyframes orbitSpin {
    from { rotate: 0deg; }
    to { rotate: 360deg; }
}

@keyframes orbitReverse {
    from { rotate: 360deg; }
    to { rotate: 0deg; }
}

@keyframes beamPulse {
    0%, 100% { opacity: .2; }
    50% { opacity: .8; }
}

@keyframes logoFloat {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-7px); }
}

.circle {
    position: relative;
    animation: pulse 1.5s infinite, logoFloat 4s ease-in-out infinite;
    background: radial-gradient(circle, #073b68, #050b16 70%);
}

.logoChoice {
    min-width: 58px;
    font-size: 25px;
    border: 1px solid #00eaff;
    background: linear-gradient(145deg, #102c55, #090d20);
    box-shadow: 0 0 12px rgba(0, 234, 255, .35);
}

.logoChoice:active {
    background: #075985;
    box-shadow: 0 0 25px #00eaff;
}

#customPanel {
    position: relative;
    border-color: #00eaff;
    box-shadow: 0 0 25px rgba(0, 145, 255, .35),
                inset 0 0 20px rgba(0, 80, 180, .15);
}

</style>
</head>

<body>

<div class="fx-background" aria-hidden="true">
    <div class="fx-orbit one"></div>
    <div class="fx-orbit two"></div>
    <div class="fx-orbit three"></div>
    <div class="fx-beam"></div>
</div>


<header>J.A.R.V.I.S</header>

<div>
<button onclick="toggleCustomization()">⚙ SETTINGS</button>
</div>

<div id="customPanel">
    <h3>JARVIS CUSTOMIZATION</h3>
    <p>Choose App Logo</p>
    <button class="logoChoice" onclick="chooseLogo('◉')">◉</button>
    <button class="logoChoice" onclick="chooseLogo('⌬')">⌬</button>
    <button class="logoChoice" onclick="chooseLogo('AI')">AI</button>
    <button class="logoChoice" onclick="chooseLogo('◈')">◈</button>
    <button class="logoChoice" onclick="chooseLogo('✧')">✧</button>
    <p id="logoStatus">Select your favorite logo.</p>
    <p>Home Screen App Icon: Next setup required.</p>
    <button onclick="toggleCustomization()">CLOSE</button>
</div>


<div class="status" id="status">
SYSTEM ONLINE
</div>

<div class="circle" id="circle">
🤖
</div>

<div>

<button class="stop" onclick="stopListening()">STOP</button>
</div>

<div>
<select id="language">
<option value="en-IN">English India</option>
<option value="hi-IN">Hindi India</option>
<option value="bn-IN">Bengali India</option>
</select>
</div>

<div id="chat">
<div class="message">
JARVIS: Hello! I am Jarvis. System online.
</div>
</div>



<div>

<button onclick="testVoice()">TEST VOICE</button>
</div>

<script src="speech.js"></script>
<script src="voice.js"></script>
<script>
window.addEventListener("load", () => {
    setTimeout(() => {
        startListening();
    }, 1000);
});
</script>
<script>


const statusBox = document.getElementById("status");
const circle = document.getElementById("circle");
const chat = document.getElementById("chat");

function setStatus(text) {
    statusBox.textContent = text;
}

function addMessage(sender, text) {
    const div = document.createElement("div");
    div.className = "message";

    const title = document.createElement("b");
    title.textContent = sender + ": ";

    div.appendChild(title);
    div.appendChild(document.createTextNode(text));

    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
}

async function speak(text) {
    const TTS = window.TextToSpeechPlugin;

    if (!TTS) {
        setStatus("NATIVE VOICE NOT AVAILABLE");
        return;
    }

    await pauseListeningForSpeech();

    try {
        try {
            await TTS.stop();
        } catch (e) {}

        await TTS.speak({
            text: text,
            lang:
document.getElementById("language").value,
            rate: 0.95,
            pitch: 1.0,
            volume: 1.0
        });
    } catch (error) {
        setStatus("TTS ERROR: " + (error.message || error));
    } finally {
        resumeListeningAfterSpeech();
    }
}

function testVoice() {
    speak("Hello. I am Jarvis. Your personal assistant system is online.");
}


async function runPhoneCommand(target) {
    const plugin = window.PhoneControlPlugin;

    if (!plugin) {
        speak("Phone control plugin পাওয়া যায়নি।");
        return;
    }

    try {
        await plugin.openTarget({ target });
        setStatus("OPENING: " + target.toUpperCase());
    } catch (error) {
        setStatus("PHONE ERROR: " + (error.message || error));
        speak("দুঃখিত, কাজটি করা যায়নি।");
    }
}

function handleVoiceCommand(text) {
    const command = text.toLowerCase().trim();

    if (/youtube|ইউটিউব/.test(command)) {
        runPhoneCommand("youtube");
        return;
    }

    if (/camera|ক্যামেরা/.test(command)) {
        runPhoneCommand("camera");
        return;
    }

    if (/wifi|wi-fi|ওয়াইফাই|ওয়াই ফাই/.test(command)) {
        runPhoneCommand("wifi");
        return;
    }

    if (/bluetooth|ব্লুটুথ/.test(command)) {
        runPhoneCommand("bluetooth");
        return;
    }

    if (/chrome|ক্রোম/.test(command)) {
        runPhoneCommand("chrome");
        return;
    }

    if (/settings?|setting|সেটিংস|সেটিং/.test(command)) {
        runPhoneCommand("settings");
        return;
    }

    if (/হ্যালো|নমস্কার|নমস্তে|হাই|hello|hi|hey/.test(command)) {
        speak("Hello! আমি জার্ভিস। কীভাবে সাহায্য করতে পারি?");
        return;
    }

    if (/তোমার নাম|তুমি কে|your name|who are you/.test(command)) {
        speak("আমার নাম জার্ভিস। আমি আপনার ব্যক্তিগত সহকারী।");
        return;
    }

    if (/সময়|কয়টা বাজে|time/.test(command)) {
        const time = new Date().toLocaleTimeString("bn-IN");
        speak("এখন সময় " + time);
        return;
    }

    if (/stop listening|বন্ধ করো|থামো/.test(command)) {
        speak("ঠিক আছে।");
        stopListening();
        return;
    }

    speak("আমি আপনার কথা শুনেছি। আরও একটু বুঝিয়ে বলবেন?");
}



document.getElementById("language")
.addEventListener("change", () => {
    if (listeningEnabled) {
        stopListening();
        startListening();
    }
});


function toggleCustomization() {
    const panel = document.getElementById("customPanel");
    panel.style.display =
        panel.style.display === "block" ? "none" : "block";
}

function chooseLogo(logo) {
    document.getElementById("circle").textContent = logo;
    localStorage.setItem("jarvisLogo", logo);
    document.getElementById("logoStatus").textContent =
        "Logo saved successfully!";
}

const savedLogo = localStorage.getItem("jarvisLogo");
if (savedLogo) {
    document.getElementById("circle").textContent = savedLogo;
}

window.addEventListener("beforeunload", () => {
    stopListening();
});

</script>
</body>
</html>
